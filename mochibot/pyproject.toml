[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mochibot"
version = "0.1.0"
description = "Telegram to WhatsApp sticker converter bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kurigram>=2.1.0",
    "TgCrypto>=1.2.5",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.8.0",
    "av>=10.0.0",
    "numpy>=1.24.0",
    "lottie[all]>=0.7.0",
    "emoji>=2.0.0",
]

[project.scripts]
mochibot = "main:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
